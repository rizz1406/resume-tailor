<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume Tailor — AI ATS resume from any job description</title>
    <meta name="description" content="Paste a job description or upload a screenshot. Get an ATS-friendly resume in LaTeX and PDF. Free." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <svg style="position: absolute; width: 0; height: 0; pointer-events: none;" aria-hidden="true">
      <filter id="liquid-refraction">
        <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" result="noise" seed="7" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
